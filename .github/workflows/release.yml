name: Release

on:
  push:
    branches:
      - master
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to publish as a GitHub Release
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/WebApi/Aruba.WebApi.csproj

      - name: Publish Web API
        run: dotnet publish src/WebApi/Aruba.WebApi.csproj --configuration Release --no-restore --output ./artifacts

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: aruba-release-${{ inputs.release_tag || github.sha }}
          path: ./artifacts

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/*