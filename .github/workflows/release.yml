name: Release

on:
  push:
    branches:
      - master
      - develop
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to publish as a GitHub Release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      WIX_EULA_ACCEPTED: wix7
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$') {
            throw 'Only stable vMajor.Minor.Patch tags may publish a release.'
          }

      - name: Set up WiX
        run: dotnet tool install --global wix --version 7.0.1

      - name: Run tests
        run: dotnet test Aruba.slnx --configuration Release

      - name: Build Windows installer
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: ./installer/Build-Installer.ps1 -ExpectedTag $env:RELEASE_TAG

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: aruba-release-${{ inputs.release_tag || github.sha }}
          path: ./artifacts/installer/*.msi
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ./artifacts/installer/*.msi