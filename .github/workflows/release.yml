name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/WebApi/Aruba.WebApi.csproj

      - name: Publish Web API
        run: dotnet publish src/WebApi/Aruba.WebApi.csproj --configuration Release --no-restore --output ./artifacts

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: aruba-release-${{ github.sha }}
          path: ./artifacts